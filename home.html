<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cyber Cafe — CyberSecurity</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #07121a;
      --bg2: #0d2430;
      --accent: #3fe0ff;
      --accent-2: #3cbef0;
      --muted: rgba(255,255,255,0.65);
      --card: rgba(255,255,255,0.03);
      --radius: 28px;
    }

    html,body{
      height:100%;
      margin:0;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 800px at 10% 20%, rgba(20,50,70,0.12), transparent 8%),
                  linear-gradient(180deg,var(--bg1), var(--bg2) 70%);
      color: #fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* subtle binary-as-pattern background (repeated tiny numbers) */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image: 
        linear-gradient(transparent 70%, rgba(255,255,255,0.01) 70%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0 1px, transparent 1px 7px);
      pointer-events:none;
      mix-blend-mode: overlay;
    }

    .wrap{
      max-width:1200px;
      margin:40px auto;
      padding:28px;
    }

    /* NAV */
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .logo{
      font-weight:700;
      letter-spacing:0.6px;
      font-size:26px;
    }

    nav{
      display:flex;
      gap:22px;
      align-items:center;
      color:var(--muted);
      font-weight:500;
      font-size:15px;
    }

    nav a{ text-decoration:none; color:var(--muted); }
    nav a:hover{ color:#fff; }

    .get-quote{
      background: linear-gradient(90deg,var(--accent),var(--accent-2));
      color:#04202a;
      padding:10px 18px;
      border-radius:999px;
      font-weight:600;
      font-size:14px;
      box-shadow: 0 6px 18px rgba(60,190,240,0.12);
      text-decoration:none;
    }

    /* HERO */
    .hero{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:30px;
      margin-top:60px;
      min-height:58vh;
    }

    .hero-left{
      width:58%;
      max-width:720px;
    }

    .kicker{
      display:inline-block;
      padding:8px 12px;
      background: rgba(255,255,255,0.02);
      border-radius:999px;
      color:var(--muted);
      font-size:13px;
      margin-bottom:18px;
    }

    h1{
      margin:0 0 18px 0;
      font-size:56px;
      line-height:0.98;
      letter-spacing:-0.6px;
      font-weight:800;
      color:#fff;
      text-shadow: 0 6px 30px rgba(0,0,0,0.6);
    }

    /* force two-line look similar to the image */
    h1 .big{
      display:block;
    }

    p.lead{
      color:var(--muted);
      font-size:15px;
      max-width:640px;
      margin:0 0 26px 0;
      line-height:1.6;
    }

    .cta{
      display:flex;
      gap:16px;
      align-items:center;
      margin-top:6px;
    }

    .btn{
      padding:12px 22px;
      border-radius:999px;
      font-weight:600;
      font-size:15px;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-width:130px;
    }

    .btn-ghost{
      background: rgba(255,255,255,0.06);
      color:#cfeff6;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.12);
    }

    .btn-primary{
      background: linear-gradient(90deg,var(--accent),var(--accent-2));
      color: #031e23;
      box-shadow: 0 10px 30px rgba(58,194,235,0.12);
    }

    /* RIGHT ILLUSTRATION area (vector SVG) */
    .hero-right{
      width:40%;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .illustration{
      width:100%;
      max-width:420px;
      filter: drop-shadow(0 18px 40px rgba(0,0,0,0.6));
      transform: translateY(0px);
    }

    /* little floating diamond squares */
    .floating-square{
      position:absolute;
      width:32px;
      height:32px;
      background: linear-gradient(180deg, rgba(63,224,255,0.12), rgba(60,190,240,0.06));
      transform: rotate(20deg);
      border-radius:6px;
      opacity:0.9;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .sq1{right:18%; top:12%;}
    .sq2{right:8%; top:42%; width:20px; height:20px; transform:rotate(10deg);}
    .sq3{right:36%; top:70%; width:18px; height:18px; opacity:0.7; transform:rotate(-10deg);}

    /* small responsiveness */
    @media (max-width:900px){
      .hero{
        flex-direction:column-reverse;
        gap:20px;
        min-height:unset;
      }
      .hero-left{ width:100%; text-align:center;}
      h1{font-size:44px;}
      .hero-right{ width:70%;}
    }

    @media (max-width:520px){
      nav{ display:none; }
      .get-quote{ padding:8px 12px; font-size:13px; }
      h1{ font-size:32px; }
      .hero-right{ width:100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div style="display:flex;align-items:center;gap:20px">
        <div class="logo">Cyber Cafe</div>
        <nav>
          <a href="aboutus.html">About Us</a>
          <a href="services.html">Services</a>
          <a href="questionaire.html">Questionnaire </a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>

      <div style="display:flex;align-items:center;gap:12px">
        <a class="get-quote" href="#">Get Free Quotes</a>
      </div>
    </header>

    <main class="hero" role="main" aria-label="Hero">
      <section class="hero-left">
        <div class="kicker">We Provide Best</div>
        <h1>
          <span class="big">CyberSecurity</span>
          <span class="big">Solutions</span>
        </h1>

        <p class="lead">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua, magna aliqua.
        </p>

        <div class="cta">
          <a class="btn btn-ghost" href="questionnaire.html">Get Started</a>
          <a class="btn btn-primary" href="contact.html">Contact Us</a>
        </div>
      </section>

      <aside class="hero-right" aria-hidden="true">
        <!-- Decorative floating squares -->
        <div class="floating-square sq1"></div>
        <div class="floating-square sq2"></div>
        <div class="floating-square sq3"></div>

        <!-- Vector illustration (stylized laptop + lock + shield) -->
        <svg class="illustration" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="security illustration">
          <defs>
            <linearGradient id="g1" x1="0" x2="1">
              <stop offset="0" stop-color="#3fe0ff"/>
              <stop offset="1" stop-color="#3cbef0"/>
            </linearGradient>
            <radialGradient id="g2" cx="30%" cy="20%">
              <stop offset="0" stop-color="#79f1ff" stop-opacity="0.28"/>
              <stop offset="1" stop-color="#05181a" stop-opacity="0"/>
            </radialGradient>
            <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="10" />
            </filter>
          </defs>

          <!-- rings under laptop -->
          <g transform="translate(80,240)">
            <ellipse cx="280" cy="160" rx="220" ry="44" fill="url(#g2)" opacity="0.25"/>
            <ellipse cx="280" cy="160" rx="180" ry="36" fill="none" stroke="rgba(63,224,255,0.08)" stroke-width="2"/>
            <ellipse cx="280" cy="160" rx="140" ry="28" fill="none" stroke="rgba(60,190,240,0.06)" stroke-width="2"/>
          </g>

          <!-- laptop bottom -->
          <g transform="translate(60,180)">
            <rect x="100" y="100" rx="12" ry="12" width="400" height="150" fill="#08161a" stroke="rgba(255,255,255,0.02)"/>
            <rect x="110" y="110" width="380" height="110" rx="8" fill="linearGradient(#g1)" opacity="0.03"/>
            <!-- keyboard keys -->
            <g fill="rgba(255,255,255,0.03)">
              <rect x="125" y="160" width="18" height="10" rx="2"></rect>
              <rect x="148" y="160" width="18" height="10" rx="2"></rect>
              <rect x="171" y="160" width="18" height="10" rx="2"></rect>
              <rect x="194" y="160" width="18" height="10" rx="2"></rect>
              <rect x="217" y="160" width="18" height="10" rx="2"></rect>
              <rect x="240" y="160" width="18" height="10" rx="2"></rect>
              <rect x="263" y="160" width="18" height="10" rx="2"></rect>
              <rect x="286" y="160" width="18" height="10" rx="2"></rect>
              <rect x="309" y="160" width="18" height="10" rx="2"></rect>
              <rect x="332" y="160" width="18" height="10" rx="2"></rect>
            </g>
            <!-- laptop screen -->
            <rect x="110" y="-10" rx="10" ry="10" width="380" height="140" fill="linearGradient(#g1)" opacity="0.06" stroke="rgba(63,224,255,0.08)"/>
            <rect x="120" y="0" rx="6" ry="6" width="360" height="120" fill="#02242a"/>
            <!-- code lines on screen -->
            <g fill="#56f0ff" opacity="0.9">
              <rect x="140" y="12" width="220" height="8" rx="3" />
              <rect x="140" y="28" width="240" height="6" rx="3" opacity="0.7" />
              <rect x="140" y="42" width="200" height="6" rx="3" opacity="0.5" />
              <rect x="140" y="58" width="120" height="6" rx="3" opacity="0.7" />
            </g>
          </g>

          <!-- lock icon in front of screen -->
          <g transform="translate(350,70) scale(1)">
            <rect x="2" y="120" rx="12" ry="12" width="160" height="120" fill="url(#g1)" opacity="0.12" stroke="rgba(63,224,255,0.25)"/>
            <rect x="26" y="140" rx="8" ry="8" width="116" height="80" fill="#041b21"/>
            <path d="M84 100 c-22 0 -40 18 -40 40 v18 h16 v-18 c0-13 11-24 24-24 s24 11 24 24 v18 h16 v-18 c0-22 -18-40 -40-40z" fill="url(#g1)" opacity="0.95"/>
            <!-- keyhole -->
            <circle cx="84" cy="178" r="12" fill="#031a1f"/>
            <rect x="78" y="166" width="12" height="22" rx="6" fill="#3fe0ff" opacity="0.18"/>
          </g>

          <!-- small phone card at right -->
          <g transform="translate(540,260) scale(0.9)">
            <rect x="0" y="0" rx="10" ry="10" width="160" height="100" fill="#01171b" stroke="rgba(63,224,255,0.05)"/>
            <rect x="18" y="18" width="124" height="64" rx="6" fill="linearGradient(#g1)" opacity="0.06"/>
            <circle cx="40" cy="48" r="10" fill="#3fe0ff" opacity="0.9"/>
            <rect x="62" y="38" width="48" height="6" rx="3" fill="#56f0ff" opacity="0.7"/>
          </g>

        </svg>
      </aside>
    </main>
  </div>
</div>

</body>
</html>
