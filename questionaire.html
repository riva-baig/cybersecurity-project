<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberShield – Security Questionnaire</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
    }
    input, textarea, select {
      background-color: #1e293b;
      border: 1px solid #334155;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #67e8f9;
      box-shadow: 0 0 0 1px #67e8f9;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="max-w-3xl w-full bg-slate-800 p-8 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold text-cyan-400 mb-6 text-center">CyberShield Security Assessment</h1>

    <form action="#" method="POST" class="space-y-6">
      <!-- Name -->
      <div>
        <label class="block mb-2 text-sm font-medium">Full Name *</label>
        <input type="text" name="name" required class="w-full px-4 py-2 rounded-md" />
      </div>

      <!-- Email -->
      <div>
        <label class="block mb-2 text-sm font-medium">Email Address *</label>
        <input type="email" name="email" required class="w-full px-4 py-2 rounded-md" />
      </div>

      <!-- Company -->
      <div>
        <label class="block mb-2 text-sm font-medium">Company Name</label>
        <input type="text" name="company" class="w-full px-4 py-2 rounded-md" />
      </div>

      <!-- Do you currently use any cybersecurity solutions? -->
      <div>
        <label class="block mb-2 text-sm font-medium">Are you currently using cybersecurity solutions?</label>
        <select name="current_solutions" class="w-full px-4 py-2 rounded-md">
          <option value="">-- Select an option --</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
          <option value="not_sure">Not Sure</option>
        </select>
      </div>

      <!-- What's your biggest concern? -->
      <div>
        <label class="block mb-2 text-sm font-medium">What’s your biggest cybersecurity concern?</label>
        <textarea name="concern" rows="3" class="w-full px-4 py-2 rounded-md"></textarea>
      </div>

      <!-- Type of data handled -->
      <div>
        <label class="block mb-2 text-sm font-medium">What type of data does your company handle?</label>
        <div class="space-y-2 pl-1 text-sm">
          <label class="block"><input type="checkbox" name="data[]" value="personal" /> Personal Data</label>
          <label class="block"><input type="checkbox" name="data[]" value="financial" /> Financial Data</label>
          <label class="block"><input type="checkbox" name="data[]" value="health" /> Health Records</label>
          <label class="block"><input type="checkbox" name="data[]" value="intellectual" /> Intellectual Property</label>
          <label class="block"><input type="checkbox" name="data[]" value="other" /> Other</label>
        </div>
      </div>

      <!-- Contact preference -->
      <div>
        <label class="block mb-2 text-sm font-medium">Preferred Contact Method</label>
        <select name="contact_method" class="w-full px-4 py-2 rounded-md">
          <option value="">-- Select --</option>
          <option value="email">Email</option>
          <option value="phone">Phone</option>
          <option value="either">Either is fine</option>
        </select>
      </div>

      <!-- Submit button -->
      <div class="text-center pt-4">
        <button type="submit" class="px-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-black font-bold rounded-md transition">
          Submit Questionnaire
        </button>
      </div>
    </form>
  </div>
</body>
</html>
