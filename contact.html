<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - CyberShield Security</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    input, textarea {
      background-color: rgba(255, 255, 255, 0.03);
    }
    input::placeholder, textarea::placeholder {
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="py-10 text-center bg-gradient-to-br from-cyan-900 via-blue-900 to-gray-900">
    <h1 class="text-4xl md:text-5xl font-bold text-cyan-400">Contact CyberShield</h1>
    <p class="text-gray-300 mt-3 text-lg">Have a question? Need a security consultation? Let’s connect.</p>
  </header>

  <!-- Contact Form Section -->
  <section class="py-16 px-6 lg:px-20">
    <div class="max-w-4xl mx-auto glass p-10 rounded-xl shadow-lg">
      <h2 class="text-3xl text-cyan-300 font-semibold mb-8">Get in Touch</h2>
      <form action="#" method="POST" class="space-y-6">

        <!-- Name -->
        <div>
          <label for="name" class="block mb-2 text-gray-300">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="John Coil"
            class="w-full px-4 py-3 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block mb-2 text-gray-300">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="johncoil@example.com"
            class="w-full px-4 py-3 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
        </div>

        <!-- Subject -->
        <div>
          <label for="subject" class="block mb-2 text-gray-300">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Security Audit Request"
            class="w-full px-4 py-3 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" />
        </div>

        <!-- Message -->
        <div>
          <label for="message" class="block mb-2 text-gray-300">Message</label>
          <textarea id="message" name="message" rows="6" required placeholder="Tell us more about your security needs..."
            class="w-full px-4 py-3 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 resize-none"></textarea>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit"
            class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-6 py-3 rounded-full shadow-md transition-all">
            Send Message
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- Optional Map or Contact Info -->
  <section class="px-6 lg:px-20 pb-20">
    <div class="max-w-4xl mx-auto mt-10 text-gray-400">
      <h3 class="text-xl text-cyan-300 font-semibold mb-4">Our Office</h3>
      <p>CyberShield HQ, Level 42, Tech Fortress Tower, Silicon Valley, CA 94043</p>
      <p>Email: support@cybershield.io</p>
      <p>Phone: +1 (555) 909-SECURE</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-900 py-8 text-center text-gray-500 text-sm">
    &copy; 2025 CyberShield Security. All rights reserved.
  </footer>

</body>
</html>
